modules:
  jira:globalPage:
    - key: projekt-reporting-hello-world-global-page
      resource: main
      resolver:
        function: resolver
      render: native
      title: Volkswohl Bund Reporting
  function:
    - key: resolver
      handler: index.handler
    - key: privacy-report
      handler: index.privacyHandler
  # Wöchentliche Meldung gespeicherter accountIds (Atlassian User Privacy)
  scheduledTrigger:
    - key: privacy-report-trigger
      function: privacy-report
      interval: week
  # Forge SQL Datenbank für Teams und Urlaube
  sql:
    - key: main
      engine: mysql
permissions:
  scopes:
    - report:personal-data
    # Genehmigungs-Issues lesen (Transitions) und anlegen/kommentieren/zuweisen
    - read:jira-work
    - write:jira-work
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/1e289df7-4196-451c-976f-6a7d2d70f208
